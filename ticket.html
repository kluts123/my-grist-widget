<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINCOMETRIC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        linear-gradient(
          90deg,
          rgba(0, 45, 40, 0.05) 0%,
          rgba(0, 45, 40, 0.20) 45%,
          rgba(0, 25, 22, 0.82) 72%,
          rgba(0, 25, 22, 0.96) 100%
        ),
        url("./background-industrial.png")
        center center / cover no-repeat fixed;
    }

    /*
      Background image:
      Place the uploaded background image in the same directory
      as this HTML file and keep the filename above.

      If you rename the image, change the url() accordingly.
    */

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
    }

    /* Dark/green overlay to make the right side suitable for content */
    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0, 35, 32, 0.05) 0%,
          rgba(0, 35, 32, 0.08) 35%,
          rgba(0, 30, 27, 0.48) 58%,
          rgba(0, 27, 24, 0.90) 78%,
          rgba(0, 24, 21, 0.97) 100%
        );
      pointer-events: none;
    }

    /*
      IFRAME
      Positioned on the right so the industrial image remains
      visible on the left.
    */
    .iframe-container {
      position: absolute;
      z-index: 2;

      top: 4vh;
      right: 3vw;
      bottom: 4vh;
      width: 52vw;

      overflow: hidden;
      border: none;
      border-radius: 12px;

      /*
        Very subtle transparency allows the background atmosphere
        to remain visible around the iframe.
      */
      background: rgba(0, 30, 27, 0.18);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    /* Responsive layout */
    @media (max-width: 1100px) {
      .iframe-container {
        left: 8vw;
        right: 8vw;
        width: auto;
      }

      .overlay {
        background:
          linear-gradient(
            90deg,
            rgba(0, 25, 23, 0.55),
            rgba(0, 25, 23, 0.90)
          );
      }
    }

    @media (max-width: 700px) {
      body {
        background-position: left center;
      }

      .iframe-container {
        top: 2vh;
        right: 3vw;
        bottom: 2vh;
        left: 3vw;
        width: auto;
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="overlay"></div>

    <section class="iframe-container">
      <iframe
        src="https://polished-night-2055.123kluts.workers.dev/"
        title="CINCOMETRIC"
        loading="eager"
        allow="fullscreen">
      </iframe>
    </section>

  </main>

</body>
</html>
