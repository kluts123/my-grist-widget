<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CINCOMETRIC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        url("./background-industrial.png")
        center center / cover no-repeat fixed;
    }

    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================================================
       BACKGROUND OVERLAY
       Keeps the left side visible while darkening the right
       side behind the form.
       ========================================================= */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 35, 32, 0.02) 0%,
          rgba(0, 35, 32, 0.05) 35%,
          rgba(0, 30, 27, 0.28) 52%,
          rgba(0, 27, 24, 0.72) 70%,
          rgba(0, 24, 21, 0.92) 100%
        );
    }

    /* =========================================================
       IFRAME CONTAINER
       
       Deliberately smaller than before so it follows the
       approximate dimensions of the form.
       ========================================================= */

    .iframe-container {
      position: absolute;
      z-index: 2;

      /*
        Vertical positioning
      */
      top: 7vh;

      /*
        Right-hand margin
      */
      right: 4vw;

      /*
        Approximate form dimensions
      */
      width: 45vw;
      height: 720px;

      /*
        Don't add another visual panel around the iframe.
      */
      background: transparent;

      border: none;
      border-radius: 12px;

      overflow: hidden;

      /*
        Optional subtle shadow.
        Remove this if you want absolutely no framing.
      */
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.22);
    }

    /* =========================================================
       IFRAME
       ========================================================= */

    iframe {
      display: block;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: none;

      background: transparent;
    }

    /* =========================================================
       DESKTOP / LARGE SCREENS
       ========================================================= */

    @media (min-width: 1500px) {

      .iframe-container {
        width: 44vw;
        height: 720px;

        top: 7vh;
        right: 4vw;
      }
    }

    /* =========================================================
       MEDIUM SCREENS
       ========================================================= */

    @media (max-width: 1200px) {

      .iframe-container {
        width: 48vw;
        height: 700px;

        top: 6vh;
        right: 3vw;
      }

      .overlay {
        background:
          linear-gradient(
            90deg,
            rgba(0, 35, 32, 0.10) 0%,
            rgba(0, 30, 27, 0.30) 45%,
            rgba(0, 25, 22, 0.82) 100%
          );
      }
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {

      body {
        background-position: left center;
      }

      .iframe-container {
        width: 65vw;
        height: 680px;

        top: 5vh;
        right: 3vw;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {

      html,
      body {
        overflow: auto;
      }

      .page {
        height: 100vh;
        min-height: 100vh;
      }

      body {
        background-position: left center;
      }

      .overlay {
        background:
          linear-gradient(
            90deg,
            rgba(0, 25, 23, 0.45),
            rgba(0, 25, 23, 0.88)
          );
      }

      .iframe-container {
        top: 3vh;
        left: 4vw;
        right: 4vw;

        width: auto;
        height: 94vh;

        border-radius: 10px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- Background darkening layer -->
    <div class="overlay"></div>

    <!-- =====================================================
         FORM / APPLICATION IFRAME
         ===================================================== -->

    <section class="iframe-container">

      <iframe
        src="https://polished-night-2055.123kluts.workers.dev/"
        title="CINCOMETRIC"
        loading="eager"
        allow="fullscreen">
      </iframe>

    </section>

  </main>

</body>
</html>
