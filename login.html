<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CINCOMETRIC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        url("./background-industrial.png")
        center center / cover no-repeat fixed;
    }

    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================================================
       BACKGROUND OVERLAY

       Exactly the same treatment as the original page.
       Left side stays visible, right side becomes darker.
       ========================================================= */

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 35, 32, 0.02) 0%,
          rgba(0, 35, 32, 0.05) 35%,
          rgba(0, 30, 27, 0.28) 52%,
          rgba(0, 27, 24, 0.72) 70%,
          rgba(0, 24, 21, 0.92) 100%
        );
    }

    /* =========================================================
       NAVIGATION CONTAINER

       Same position and approximate dimensions as the
       original iframe.
       ========================================================= */

    .nav-container {
      position: absolute;
      z-index: 2;

      top: 7vh;
      right: 4vw;

      width: 45vw;
      height: 720px;

      background: transparent;

      border: none;
      border-radius: 12px;

      overflow-y: auto;
      overflow-x: hidden;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.22);

      padding: 4px 8px 20px 8px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .nav-header {
      margin: 0 0 20px 0;
      padding: 0 8px;
    }

    .page-title {
      margin: 0;

      color: rgba(255, 255, 255, 0.96);

      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.08em;

      line-height: 1.15;
    }

    .title-line {
      width: 100%;
      height: 1px;

      margin-top: 12px;

      background:
        linear-gradient(
          90deg,
          rgba(95, 190, 150, 0.85) 0%,
          rgba(95, 190, 150, 0.35) 35%,
          rgba(255, 255, 255, 0.08) 75%,
          rgba(255, 255, 255, 0) 100%
        );
    }

    /* =========================================================
       MENU
       ========================================================= */

    .menu {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    /* =========================================================
       NORMAL BUTTON
       ========================================================= */

    .menu-button {
      position: relative;

      width: 100%;
      min-height: 48px;

      display: flex;
      align-items: center;

      padding: 0 18px 0 26px;

      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 6px;

      background:
        rgba(0, 35, 32, 0.48);

      color: rgba(255, 255, 255, 0.92);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;

      text-align: left;

      cursor: pointer;

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease,
        color 0.18s ease;
    }

    /* Vertical CINCOMETRIC accent */

    .menu-button::before {
      content: "";

      position: absolute;

      left: 0;
      top: 7px;
      bottom: 7px;

      width: 4px;

      border-radius: 0 3px 3px 0;

      background:
        rgba(91, 190, 148, 0.82);
    }

    .menu-button:hover {
      background:
        rgba(15, 62, 56, 0.72);

      border-color:
        rgba(255, 255, 255, 0.24);

      color: #ffffff;

      transform: translateX(3px);
    }

    .menu-button:active {
      transform: translateX(1px);
    }

    /* =========================================================
       GROUP
       ========================================================= */

    .menu-group {
      width: 100%;
    }

    .group-button {
      position: relative;

      width: 100%;
      min-height: 48px;

      display: flex;
      align-items: center;

      padding: 0 18px 0 26px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;

      background:
        rgba(0, 43, 39, 0.62);

      color: rgba(255, 255, 255, 0.96);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      transition:
        background 0.18s ease,
        border-color 0.18s ease;
    }

    .group-button::before {
      content: "";

      position: absolute;

      left: 0;
      top: 7px;
      bottom: 7px;

      width: 4px;

      border-radius: 0 3px 3px 0;

      background:
        rgba(91, 190, 148, 0.95);
    }

    .group-button:hover {
      background:
        rgba(20, 70, 63, 0.76);

      border-color:
        rgba(255, 255, 255, 0.24);
    }

    /* =========================================================
       GROUP ARROW
       ========================================================= */

    .group-arrow {
      margin-left: auto;

      width: 9px;
      height: 9px;

      border-right:
        1.5px solid rgba(255, 255, 255, 0.75);

      border-bottom:
        1.5px solid rgba(255, 255, 255, 0.75);

      transform:
        rotate(45deg)
        translateY(-2px);

      transition:
        transform 0.2s ease;
    }

    .menu-group.collapsed .group-arrow {
      transform:
        rotate(-45deg)
        translate(-2px, 2px);
    }

    /* =========================================================
       GROUP CHILDREN
       ========================================================= */

    .group-items {
      display: flex;
      flex-direction: column;

      gap: 6px;

      margin-top: 6px;
      padding-left: 14px;

      overflow: hidden;

      max-height: 1000px;

      opacity: 1;

      transition:
        max-height 0.25s ease,
        opacity 0.2s ease,
        margin-top 0.25s ease;
    }

    .menu-group.collapsed .group-items {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    /* =========================================================
       EMPTY MENU
       ========================================================= */

    .empty-message {
      padding: 20px 10px;

      color: rgba(255, 255, 255, 0.60);

      font-size: 14px;
    }

    /* =========================================================
       SCROLLBAR
       ========================================================= */

    .nav-container::-webkit-scrollbar {
      width: 5px;
    }

    .nav-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .nav-container::-webkit-scrollbar-thumb {
      background:
        rgba(255, 255, 255, 0.18);

      border-radius: 4px;
    }

    /* =========================================================
       LARGE SCREENS
       ========================================================= */

    @media (min-width: 1500px) {

      .nav-container {
        width: 44vw;
        height: 720px;

        top: 7vh;
        right: 4vw;
      }
    }

    /* =========================================================
       MEDIUM SCREENS
       ========================================================= */

    @media (max-width: 1200px) {

      .nav-container {
        width: 48vw;
        height: 700px;

        top: 6vh;
        right: 3vw;
      }

      .overlay {
        background:
          linear-gradient(
            90deg,
            rgba(0, 35, 32, 0.10) 0%,
            rgba(0, 30, 27, 0.30) 45%,
            rgba(0, 25, 22, 0.82) 100%
          );
      }
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {

      body {
        background-position: left center;
      }

      .nav-container {
        width: 65vw;
        height: 680px;

        top: 5vh;
        right: 3vw;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {

      html,
      body {
        overflow: auto;
      }

      .page {
        height: 100vh;
        min-height: 100vh;
      }

      body {
        background-position: left center;
      }

      .overlay {
        background:
          linear-gradient(
            90deg,
            rgba(0, 25, 23, 0.45),
            rgba(0, 25, 23, 0.88)
          );
      }

      .nav-container {
        position: absolute;

        top: 3vh;
        left: 4vw;
        right: 4vw;

        width: auto;
        height: 94vh;

        padding: 4px 5px 20px 5px;

        border-radius: 10px;
      }

      .page-title {
        font-size: 25px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =====================================================
         BACKGROUND OVERLAY
         ===================================================== -->

    <div class="overlay"></div>


    <!-- =====================================================
         RIGHT-HAND NAVIGATION
         ===================================================== -->

    <section class="nav-container">

      <div class="nav-header">

        <h1
          class="page-title"
          id="pageTitle">
          CINCOMETRIC
        </h1>

        <div class="title-line"></div>

      </div>


      <div
        class="menu"
        id="menu">
      </div>

    </section>

  </main>


  <script>

    /* ========================================================
       CONFIGURATION
       
       THIS IS THE ONLY SECTION YOU NEED TO EDIT.
       ======================================================== */

    const CONFIG = {

      pageTitle: "CINCOMETRIC",

      menu: [

        /* ----------------------------------------------------
           TOP LEVEL BUTTONS
           ---------------------------------------------------- */

        {
          title: "Portfolio",
          url: "https://5metric.duckdns.org/13dnB98DfBj6/Projects-Hub/p/4?style=singlePage"
        },
        
        {
          title: "Projects",
          url: "https://5metric.duckdns.org/13dnB98DfBj6/Projects-Hub/p/3.0?style=singlePage"
        },
        
        {
          title: "MOCs",
          url: "https://5metric.duckdns.org/wKCYTzQgacKV/MOC-Hub-live/p/76.0?style=singlePage"
        },
        
        {
          title: "Resources",
          url: "https://5metric.duckdns.org/gG2tkwnkj3GP/Resource-Hub-live/p/10.0?style=singlePage"
        },

        {
          title: "Unit Rates",
          url: "https://5metric.duckdns.org/2RbJPPxcm1bv/Unit-Rate-Database/p/3?style=singlePage"
        }
        
      ]
    };


    /* ========================================================
       INITIALISE
       ======================================================== */

    document.title =
      CONFIG.pageTitle || "CINCOMETRIC";

    document.getElementById("pageTitle").textContent =
      CONFIG.pageTitle || "CINCOMETRIC";


    const menuElement =
      document.getElementById("menu");


    /* ========================================================
       CREATE NORMAL BUTTON
       ======================================================== */

    function createMenuButton(item) {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "menu-button";

      button.textContent =
        item.title;

      button.addEventListener(
        "click",
        function () {

          if (!item.url) {
            return;
          }

          navigate(item.url);

        }
      );

      return button;
    }


    /* ========================================================
       NAVIGATION
       ======================================================== */

    function navigate(url) {

      try {

        window.top.location.href = url;

      } catch (error) {

        window.location.href = url;

      }
    }


    /* ========================================================
       CREATE GROUP
       ======================================================== */

    function createGroup(title, items) {

      const group =
        document.createElement("div");

      group.className =
        "menu-group";


      const header =
        document.createElement("button");

      header.type = "button";

      header.className =
        "group-button";


      const label =
        document.createElement("span");

      label.textContent =
        title;


      const arrow =
        document.createElement("span");

      arrow.className =
        "group-arrow";


      header.appendChild(label);
      header.appendChild(arrow);


      const children =
        document.createElement("div");

      children.className =
        "group-items";


      items.forEach(
        function (item) {

          children.appendChild(
            createMenuButton(item)
          );

        }
      );


      group.appendChild(header);
      group.appendChild(children);


      header.addEventListener(
        "click",
        function () {

          group.classList.toggle(
            "collapsed"
          );

        }
      );


      return group;
    }


    /* ========================================================
       BUILD MENU
       ======================================================== */

    const groups =
      new Map();

    const topLevel =
      [];


    CONFIG.menu.forEach(
      function (item) {

        if (!item.title) {
          return;
        }


        if (item.parent) {

          if (!groups.has(item.parent)) {

            groups.set(
              item.parent,
              []
            );

          }

          groups
            .get(item.parent)
            .push(item);

        } else {

          topLevel.push(item);

        }

      }
    );


    /* --------------------------------------------------------
       Top-level buttons
       -------------------------------------------------------- */

    topLevel.forEach(
      function (item) {

        menuElement.appendChild(
          createMenuButton(item)
        );

      }
    );


    /* --------------------------------------------------------
       Groups
       
       Order follows the order in CONFIG.
       -------------------------------------------------------- */

    const renderedGroups =
      new Set();


    CONFIG.menu.forEach(
      function (item) {

        if (!item.parent) {
          return;
        }


        if (
          renderedGroups.has(
            item.parent
          )
        ) {
          return;
        }


        renderedGroups.add(
          item.parent
        );


        const items =
          groups.get(
            item.parent
          );


        if (
          items &&
          items.length
        ) {

          menuElement.appendChild(
            createGroup(
              item.parent,
              items
            )
          );

        }

      }
    );


    /* --------------------------------------------------------
       Empty configuration
       -------------------------------------------------------- */

    if (
      !menuElement.children.length
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-message";

      empty.textContent =
        "No navigation items configured.";

      menuElement.appendChild(empty);

    }

  </script>

</body>
</html>
